# Configuracao do SonarCloud.
#
# Existe para que o scanner possa ser executado de fora do Gradle (sonar-scanner
# na CLI ou no CI), sem depender de o plugin ler as propriedades do build.gradle.
# As mesmas chaves estao declaradas no bloco `sonar {}` do build.gradle, que e o
# caminho usado pelo workflow.

sonar.projectKey=MarkosFerreiraTech_android-spaced-repetition
sonar.organization=markosferreiratech
sonar.projectName=Cerebro - Repeticao Espacada
sonar.projectVersion=0.2.0

# Codigo de producao e de teste
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# Bytecode compilado pelo AGP, necessario para a analise semantica
sonar.java.binaries=build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.test.binaries=build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes

# Cobertura exportada pelo JaCoCo
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/testDebugUnitTest

# Exclusoes: codigo gerado nao e escrito nem mantido neste repositorio
sonar.exclusions=\
  **/R.java,\
  **/R$*.java,\
  **/BuildConfig.java,\
  **/*Binding.java,\
  **/databinding/**,\
  **/*_Impl.java

# Testes de UI nao contam para cobertura de codigo de producao
sonar.coverage.exclusions=\
  **/presentation/**,\
  **/di/**,\
  **/CerebroApplication.java

# O portao de qualidade bloqueia o merge: o job falha se o gate nao passar.
sonar.qualitygate.wait=true
