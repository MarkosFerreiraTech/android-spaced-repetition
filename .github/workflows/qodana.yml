name: Qodana (analise complementar)

# Analise de qualidade com o motor de inspecoes do IntelliJ IDEA.
#
# PAPEL: complementar e NAO bloqueante. O portao obrigatorio de qualidade
# continua sendo o SonarCloud (job "SonarCloud (quality gate)" no ci.yml),
# conforme o requisito da atividade. Este job agrega os achados do Qodana
# (inspecoes do Android Studio + auditoria de dependencias via Mend.io) e
# publica o relatorio SARIF, sem reprovar a pipeline.
#
# O token NAO fica no repositorio: e criado pela automacao do Qodana Cloud e
# lido aqui apenas pelo nome do secret, injetado pelo runner do GitHub.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  security-events: write
  pull-requests: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    # Nao bloqueia: o gate obrigatorio e o SonarCloud.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo: necessario para analise de diff em pull request.
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          # O linter Android roda o Gradle do projeto por baixo; sem RAM
          # suficiente o daemon morre com OOM durante a indexacao.
          args: --linter,jetbrains/qodana-jvm-android:2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1786329306 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          # Evita que o Android SDK/Gradle baixe em um diretorio read-only.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'

      - name: Publicar relatorio SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
