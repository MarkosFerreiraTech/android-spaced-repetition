name: CI

on:
  # Todo push em qualquer branch deve ser validado. Restringir a main/develop
  # deixava branches de feature sem cobertura de CI ate a abertura do PR.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name != 'develop' }}

      - name: Permissao do wrapper
        run: chmod +x ./gradlew

      - name: 'Android Lint (portao: abortOnError)'
        id: lint
        run: |
          set +e
          ./gradlew lintDebug --stacktrace 2>&1 | tee /tmp/lint.log
          status=${PIPESTATUS[0]}
          python3 scripts/ci/lint_report.py build/reports/lint-results-debug.xml || true
          if [ "$status" -ne 0 ]; then python3 scripts/ci/emit_gradle_errors.py /tmp/lint.log; fi
          exit $status

      - name: Testes unitarios
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/test_report.py || true
            python3 scripts/ci/emit_gradle_errors.py /tmp/test.log
          fi
          exit $status

      - name: Relatorio de cobertura
        run: ./gradlew jacocoTestReport --stacktrace

      - name: 'Portao de cobertura (global >= 80%, dominio >= 95%)'
        run: ./gradlew jacocoTestCoverageVerification --stacktrace

      - name: Montar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-debug-apk
          path: build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/lint-results-debug.html
          retention-days: 14

  static-analysis:
    name: Analise estatica
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissao do wrapper
        run: chmod +x ./gradlew

      - name: Checkstyle
        run: |
          set +e
          ./gradlew checkstyleMain --stacktrace 2>&1 | tee /tmp/checkstyle.log
          status=${PIPESTATUS[0]}
          if [ -f build/reports/checkstyle/main.xml ]; then
            python3 scripts/ci/checkstyle_report.py build/reports/checkstyle/main.xml || true
          else
            echo "::warning::Checkstyle nao gerou relatorio: a falha esta na configuracao da tarefa, nao no codigo."
            # Imprime as ultimas linhas do log como anotacoes, sem filtro,
            # para expor a causa raiz mesmo quando nenhuma palavra-chave casa.
            tail -40 /tmp/checkstyle.log | sed 's/^/FAIL: /' | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/::/:/g' | cut -c1-350)
              echo "::error::$clean"
            done
          fi
          exit $status

      - name: Publicar relatorios de analise estatica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-analise-estatica
          path: |
            build/reports/checkstyle/
            build/reports/spotbugs/
          retention-days: 14

      - name: SpotBugs
        run: ./gradlew spotbugsMain --stacktrace

  security:
    name: Varredura de seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (nenhum segredo versionado - RNF13)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar ausencia de permissao de INTERNET (RNF05)
        run: |
          # Remove comentarios XML antes de procurar a permissao, para que a
          # documentacao dentro do manifesto nao gere falso positivo.
          python3 - <<'SCRIPT'
          import re
          import sys

          raw = open("src/main/AndroidManifest.xml", encoding="utf-8").read()
          without_comments = re.sub(r"<!--.*?-->", "", raw, flags=re.DOTALL)

          if re.search(r"android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)", without_comments):
              print("::error::O aplicativo e offline-first: permissoes de rede nao podem ser declaradas.")
              sys.exit(1)

          print("OK: nenhuma permissao de rede declarada em src/main/AndroidManifest.xml")
          SCRIPT

  sonar:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # Condicional: sem o secret o job e skipped, nunca failed (US10)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar disponibilidade do SONAR_TOKEN
        id: token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN ausente: analise SonarCloud ignorada. Os portoes locais (JaCoCo, lint, Checkstyle, SpotBugs) permanecem obrigatorios."
          fi

      - uses: actions/setup-java@v4
        if: steps.token.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        if: steps.token.outputs.available == 'true'
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        if: steps.token.outputs.available == 'true'

      - name: Cache do pacote SonarScanner
        if: steps.token.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analise SonarCloud
        if: steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            --stacktrace
