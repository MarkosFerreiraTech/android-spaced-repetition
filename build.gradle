import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification
import org.gradle.testing.jacoco.tasks.JacocoReport

plugins {
    alias(libs.plugins.android.application)
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.sonarqube' version '5.1.0.4882'
}

android {
    namespace 'com.markosferreira.spacedrepetition'
    compileSdk 35

    defaultConfig {
        applicationId "com.markosferreira.spacedrepetition"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Schema do Room versionado no Git (RNF06)
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        // ExecutorService pool usado pela camada de dados (ADR-004)
        buildConfigField "int", "CSV_IMPORT_POOL_SIZE", "1"
        buildConfigField "int", "CSV_MAX_LINES", "50000"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            testCoverageEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Assinatura de release fora do escopo: o APK entregue é o de debug (charter §4.2)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                useJUnitPlatform()
                testLogging {
                    events "passed", "skipped", "failed"
                }
                maxHeapSize = "2g"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
        disable 'GradleDependency', 'AndroidGradlePluginVersion'
        htmlReport true
        xmlReport true
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.swiperefreshlayout
    implementation libs.activity
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.opencsv
    implementation libs.security.crypto

    coreLibraryDesugaring libs.desugar.jdk.libs

    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.vintage.engine
    testImplementation libs.junit4
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.robolectric
    testImplementation libs.archunit.junit5
    // InstantTaskExecutorRule: permite observar LiveData na thread de teste
    testImplementation libs.core.testing
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.room.testing

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.intents
    androidTestImplementation libs.room.testing
}

// ---------------------------------------------------------------------------
// Analise estatica local: portao que nao depende de servico externo (US10)
// ---------------------------------------------------------------------------
checkstyle {
    toolVersion = '10.20.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
    showViolations = true
}

// O plugin Checkstyle cria tarefas por source set do projeto Java. Como o
// projeto Android tem o codigo em src/main/java (e nao no source set "main"
// do projeto raiz), nenhuma tarefa e criada pela convencao. Registramos uma
// tarefa explicita, sem depender de nome inferido.
tasks.register('checkstyleMain', Checkstyle) {
    description = 'Executa o Checkstyle sobre o codigo de producao.'
    group = 'verification'
    source = fileTree('src/main/java') {
        include '**/*.java'
    }
    classpath = files()
    reports {
        xml.required = true
        xml.outputLocation = file("${buildDir}/reports/checkstyle/main.xml")
        html.required = true
        html.outputLocation = file("${buildDir}/reports/checkstyle/main.html")
    }
}

spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = false
    // Kotlin gera classes internas para constantes de enum com corpo, e o Groovy
    // resolveria "Confidence.MEDIUM" como a classe aninhada. valueOf evita isso.
    effort.set(Effort.valueOf('MAX'))
    reportLevel.set(Confidence.valueOf('MEDIUM'))
    excludeFilter.set(file('config/spotbugs-exclude.xml'))
}

// Mesma razao do Checkstyle: o plugin cria tarefas por source set do projeto
// Java, e o codigo Android nao esta no source set "main" do projeto raiz.
tasks.register('spotbugsMain', SpotBugsTask) {
    description = 'Executa o SpotBugs sobre o bytecode de producao.'
    group = 'verification'
    // As classes vem do build do Android, nao do source set Java do projeto raiz
    // (SpotBugsTask expoe classDirs/sourceDirs, nao um `classpath`).
    dependsOn 'compileDebugJavaWithJavac'
    classDirs = files("${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    sourceDirs = files('src/main/java')
    auxClassPaths = files()
    // Sem esta linha o config/spotbugs-exclude.xml e ignorado e o SpotBugs
    // reporta codigo gerado pelo Room e dependencias imutaveis como defeito.
    excludeFilter = file('config/spotbugs-exclude.xml')
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    reports {
        html.required = true
        html.outputLocation = file("${buildDir}/reports/spotbugs/main.html")
        xml.required = true
        xml.outputLocation = file("${buildDir}/reports/spotbugs/main.xml")
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'MarkosFerreiraTech_android-spaced-repetition'
        property 'sonar.organization', 'markosferreiratech'
        property 'sonar.projectName', 'Cerebro - Repeticao Espacada'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.binaries', 'build/intermediates/javac/debug/classes'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml'
        // Portao de qualidade (RNF18)
        property 'sonar.qualitygate.wait', 'true'
    }
}

// ---------------------------------------------------------------------------
// Cobertura de testes: JaCoCo com portao de qualidade (RNF17)
// Dominio exige >= 95%; global exige >= 80%.
// ---------------------------------------------------------------------------
apply plugin: 'jacoco'

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
    jacoco {
        excludeClassLoaders = ["*Robolectric*"]
    }
}

def coverageExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/Manifest*.*',
    '**/*_ViewBinding.*',
    '**/*Binding.*',
    '**/*Activity.*',
    '**/*Adapter.*',
    '**/databinding/**'
]

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: coverageExcludes)
    classDirectories.setFrom(files([debugTree]))
    sourceDirectories.setFrom(files(['src/main/java']))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'
    violationRules {
        rule {
            // Regra global (RNF17)
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
            // Regra do dominio: o coracao do produto exige cobertura maior.
            // Aplicada em regra separada por pacote na task abaixo.
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.markosferreira.spacedrepetition.domain.*']
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
        }
    }
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: coverageExcludes)
    classDirectories.setFrom(files([debugTree]))
    sourceDirectories.setFrom(files(['src/main/java']))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}
