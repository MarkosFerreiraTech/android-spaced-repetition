# ---------------------------------------------------------------------------
# Configuracao do build Android
# ---------------------------------------------------------------------------

# Obrigatorio: o projeto usa AndroidX (AppCompat, Material, Room, Lifecycle).
android.useAndroidX=true

# Nomes de recursos nao transitivos: reduz o tamanho do R e evita colisoes.
android.nonTransitiveRClass=true

# Builds de biblioteca sem recursos locais (nao se aplica a app, mantido explicito).
android.defaults.buildfeatures.buildconfig=true

# ---------------------------------------------------------------------------
# Daemon e memoria: o CI usa daemon desativado, mas o build local se beneficia.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Qualidade
# ---------------------------------------------------------------------------
# Falhar o build em qualquer violacao do Checkstyle (RNF18)
checkstyle.maxWarnings=0
